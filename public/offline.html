<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" />
    <title>目前沒有網路｜KURACHEN 管理</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0c0c0e;
        color: #f2eee5;
        font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px 24px;
        border: 1px solid #3a3426;
        border-radius: 16px;
        background: #18181b;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: #c9a84c;
        color: #0c0c0e;
        font-weight: 800;
      }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0 0 22px; color: #aaa59a; line-height: 1.7; }
      button {
        width: 100%;
        padding: 12px 18px;
        border: 0;
        border-radius: 10px;
        background: #c9a84c;
        color: #0c0c0e;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">藏前</div>
      <h1>目前沒有網路連線</h1>
      <p>管理資料不會儲存在離線頁面。請重新連上網路後再繼續操作。</p>
      <button type="button" onclick="window.location.reload()">重新連線</button>
    </main>
  </body>
</html>
